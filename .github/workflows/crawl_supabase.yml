name: 自动爬量子视频入库Supabase
on:
  schedule:
    - cron: "0 4/8 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
          
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests psycopg2-binary pypinyin

      - name: 运行爬虫
        run: python crawler_pg.py
        env:
          TZ: Asia/Shanghai         
          DB_HOST: ${{ vars.PG_HOST }}
          DB_PORT: ${{ vars.PG_PORT }}
          DB_NAME: ${{ vars.PG_DATABASE }}
          DB_USER: ${{ vars.PG_USER }}
          DB_PASS: ${{ secrets.PG_PASS }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
